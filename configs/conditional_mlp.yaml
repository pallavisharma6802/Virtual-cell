# Milestone 3 conditional model. Currently runs on the synthetic fixture
# only via scripts/train_conditional.py (not yet wired to real data) —
# see docs/experiment_log.md for status and results.
run:
  name: conditional_mlp
  seed: 0
split:
  type: held_out_target
  val_frac: 0.2
  test_frac: 0.2
model:
  kind: conditional_mlp
  target_descriptor: control_mean_std   # weak, generalizable; see data/target_descriptors.py
  control_hidden_dim: 128
  target_hidden_dim: 32
  fusion_hidden_dim: 128
training:
  loss: huber
  lr: 0.001
  max_epochs: 200
  patience: 15
output_dir: outputs/conditional_mlp
