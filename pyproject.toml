[project]
name = "virtualcell"
version = "0.1.0"
description = "Predicting single-cell transcriptional responses to genetic perturbations with rigorous held-out-target evaluation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy>=1.9",
    "torch>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "pytest>=7.4",
]

[project.optional-dependencies]
gcs = ["gcsfs>=2023.1", "h5py>=3.9"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
